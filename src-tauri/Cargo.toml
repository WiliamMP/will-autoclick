[package]
name = "will-autoclick"
version = "0.1.0"
description = "Auto clicker for Windows"
authors = ["Wiliam Patricio"]
edition = "2021"
license = "MIT"

[lib]
# `_lib` suffix avoids a name clash with the bin on Windows (cargo#8519)
name = "will_autoclick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
